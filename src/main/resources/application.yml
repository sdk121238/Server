# 运行配置；数据库、密钥与账号密码通过本机环境变量注入。
server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
spring:
  application:
    name: followup-server
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/derm_followup?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC}
    username: ${DB_USERNAME:derm_app}
    password: ${DB_PASSWORD:}
    hikari:
      transaction-isolation: TRANSACTION_READ_COMMITTED
  flyway:
    enabled: true
  jackson:
    deserialization:
      fail-on-trailing-tokens: true
app:
  provision-password: ${PROVISION_PASSWORD:}
  public-url: ${APP_PUBLIC_URL:http://127.0.0.1:8080}
  storage-root: ${STORAGE_ROOT:./data/objects}
  signing-key: ${APP_SIGNING_KEY:}
  bootstrap-account: ${BOOTSTRAP_ACCOUNT:}
  bootstrap-password: ${BOOTSTRAP_PASSWORD:}
logging:
  level:
    com.derm: INFO
